name: Build Envimo ROS 2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout automation repository
      # --------------------------------------------------

      - name: Checkout automation repository
        uses: actions/checkout@v5

      # --------------------------------------------------
      # 2. Checkout bringup repository
      # --------------------------------------------------

      - name: Checkout envimo401_bringup
        uses: actions/checkout@v5
        with:
          repository: mohsenrahmanikivi/envimo401_bringup
          ref: devel
          path: ros2_ws/src/envimo401_bringup

      # --------------------------------------------------
      # 3. Checkout chassis repository temporarily
      # --------------------------------------------------

      - name: Checkout envimo401_chassis
        uses: actions/checkout@v5
        with:
          repository: mohsenrahmanikivi/envimo401_chassis
          ref: devel
          path: chassis_source

      # --------------------------------------------------
      # 4. Relocated the packages
      # --------------------------------------------------

      - name: Relocated the packages
        run: |
          set -e

          mkdir -p ros2_ws/src

          cp -r chassis_source/ROS2/src/chassis_enable \
                ros2_ws/src/

          cp -r chassis_source/ROS2/src/segway_msgs \
                ros2_ws/src/

          cp -r chassis_source/ROS2/src/segwayrmp \
                ros2_ws/src/

          mkdir -p ros2_ws/LibAPI

          cp -r chassis_source/LibAPI/lib \
                ros2_ws/LibAPI/

      # --------------------------------------------------
      # 5. Validate workspace structure
      # --------------------------------------------------

      - name: Validate ROS workspace
        run: |
          set -e

          echo "Checking required ROS packages..."

          test -f ros2_ws/src/envimo401_bringup/package.xml
          test -f ros2_ws/src/chassis_enable/package.xml
          test -f ros2_ws/src/segway_msgs/package.xml
          test -f ros2_ws/src/segwayrmp/package.xml

          echo "Checking ARM64 Segway library..."

          test -f ros2_ws/LibAPI/lib/libctrl_arm64-v8a.so

          echo ""
          echo "Workspace structure:"
          find ros2_ws -maxdepth 3 -type f | sort

          echo ""
          echo "Validation successful."
     
      # --------------------------------------------------
      # 6. Enable ARM64 emulation
      # --------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # --------------------------------------------------
      # 7. Set up Docker Buildx
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------
        # 8. Build ARM64 Docker image
      # --------------------------------------------------
      
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          tags: envimo-robot:test
          load: true

      # --------------------------------------------------
      # 9. Show the image
      # --------------------------------------------------
      
      - name: Check Docker image
        run: docker images